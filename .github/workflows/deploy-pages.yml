name: Deploy Beta 2.13 Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build static runtimes
        run: |
          npm ci
          npm run build

      - name: Prepare static site
        run: |
          node scripts/publish-staging.mjs --include-builder --skip-build --out=dist --base-url=https://verbosebard.github.io/angel-sword-lirian-chronicles-builder/
          node scripts/test-staging-deploy.mjs --include-builder --artifact=dist --base-url=https://verbosebard.github.io/angel-sword-lirian-chronicles-builder/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
