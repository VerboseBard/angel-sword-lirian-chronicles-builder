<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angel Sword Dice Overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    #dice-flight-layer { position: fixed; inset: 0; pointer-events: none; }
    #roll-chips {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: flex-start; justify-content: center;
      max-width: calc(100vw - 32px); pointer-events: none;
    }
    .chip {
      background: rgba(17, 24, 39, 0.94); color: #e8ecf5;
      border: 1px solid #856c24; border-radius: 12px;
      padding: 9px 16px; text-align: center; pointer-events: none;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      min-width: 150px; max-width: 230px;
      opacity: 0; transform: translateY(-8px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .chip.is-visible { opacity: 1; transform: translateY(0); }
    .chip.is-fading { opacity: 0; transform: translateY(-8px); }
    .chip-who { font-size: 0.72rem; color: #9fb0d8; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .gm-badge {
      font-size: 0.62rem; font-weight: 800; letter-spacing: 0.06em;
      background: #856c24; color: #ffe59a; border-radius: 5px; padding: 1px 5px;
    }
    .chip-label { font-size: 0.95rem; font-weight: 700; margin-top: 2px; }
    .chip-total { font-size: 1.3rem; font-weight: 800; color: #ffe59a; margin-top: 2px; }
    .chip-breakdown { font-size: 0.7rem; color: #bcc7dc; margin-top: 3px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="dice-flight-layer"></div>
  <div id="roll-chips"></div>
  <script>
    window.LYRIAN_DISABLE_LEGACY_GLB_DICE = true;
    /* Task 008 (WS4): the builder's existing roll/impact sound assets,
       reused as-is. Declared here (HTML text) rather than as a literal
       inside overlay.js because the WS2 staging crawler only scans HTML
       files for quoted asset-path references (see
       scripts/lib/owlbear-staging-assets.mjs — "nested references
       discovered here (dist/*.js, assets/*) are leaf files, not more
       HTML"); a path buried only inside the bundled dist/overlay.js would
       never be added to the staging closure and would silently 404 once
       published. */
    window.ASD_DICE_SOUND_ASSETS = {
      rollBed: "../assets/sounds/dice-roll-bed-142528.mp3",
      impact: "../assets/sounds/dice-impact-95077.mp3"
    };
    (function () {
      function load(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed to load " + src)); };
          document.head.appendChild(script);
        });
      }
      var V = "?v=20260825-numeral-dots-v3";
      load("../assets/dice/promoted-dice-skins.registry.js" + V)
        .catch(function () { /* promoted sets are optional */ })
        .then(function () {
          var sidecars = (window.LYRIAN_PROMOTED_DICE_SKINS || [])
            .map(function (pack) { return pack && pack.faceArtScript; })
            .filter(Boolean)
            .map(function (src) { return "../" + src; });
          var list = [
            "../assets/vendor/three.min.js",
            "../assets/vendor/GLTFLoader.js",
            "../assets/dice-3d/dice-3d-embedded.js" + V,
            "../assets/dice-3d/new-angelsword-dice-face-art.384-webp.js" + V
          ].concat(sidecars, [
            "../assets/dice-3d/lyrian-accurate-dice.js" + V,
            "../assets/dice-3d/legacy-dice-roller-capture.js" + V,
            "../assets/dice-3d/dice-geometry.js" + V,
            "../assets/dice-3d/character-sheet-skin-studio.js" + V,
            "../assets/dice-3d/shared-dice-roller-core.js" + V,
            "../assets/dice-3d/dice-roller-router.js" + V
          ]);
          return list.reduce(function (chain, src) {
            return chain.then(function () { return load(src); });
          }, Promise.resolve());
        })
        .then(function () {
          window.dispatchEvent(new CustomEvent("asd-dice-runtime-ready"));
        })
        .catch(function () {
          window.dispatchEvent(new CustomEvent("asd-dice-runtime-error"));
        });
    })();
  </script>
  <script type="module" src="dist/overlay.js"></script>
</body>
</html>
