<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rana Dice - Special Results Check</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1200px;
      min-height: 920px;
      color: #f8ddb0;
      background:
        radial-gradient(circle at 50% 30%, rgba(11, 150, 132, 0.25), transparent 33%),
        linear-gradient(145deg, #061e1b, #03080c 58%, #190d18);
    }
    main { width: 1200px; margin: 0 auto; padding: 28px 30px 34px; }
    h1 { margin: 0; text-align: center; font-size: 46px; letter-spacing: 0.06em; }
    .subtitle {
      margin: 8px 0 22px;
      color: #8af4df;
      text-align: center;
      font: 700 15px/1.3 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    article {
      min-height: 365px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid rgba(221, 173, 86, 0.72);
      border-radius: 18px;
      background: rgba(2, 12, 13, 0.78);
      box-shadow: inset 0 0 35px rgba(18, 179, 159, 0.08), 0 14px 30px rgba(0, 0, 0, 0.35);
    }
    article img { display: block; width: 100%; height: 305px; object-fit: contain; }
    h2 { margin: 4px 0 0; text-align: center; font-size: 23px; }
    #status { text-align: center; font: 700 14px system-ui, sans-serif; }
    html[data-ready="true"] #status { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Rana Dice - Special Results</h1>
    <p class="subtitle">Natural 1 tail tip - Natural 20 portrait - All D4 settled orientations</p>
    <section class="grid" id="grid"></section>
    <p id="status">Loading and validating installed Rana dice...</p>
  </main>

  <script src="assets/dice/promoted-dice-skins.registry.js"></script>
  <script src="assets/dice-3d/promoted/rana-full-set.js?v=d4-integrated-numbers-v2"></script>
  <script src="assets/dice-3d/character-sheet-skin-studio.js"></script>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/dice-3d/dice-geometry.js?v=shared-contract-3-angel-d4-v2"></script>
  <script src="assets/dice-3d/shared-dice-roller-core.js?v=shared-contract-3-angel-d4-v4"></script>
  <script>
    (async function renderChecks() {
      const setId = "rana-full-set";
      const checks = [
        { die: "D20", sides: 20, value: 1, label: "Natural 1 - Tail Tip" },
        { die: "D20", sides: 20, value: 20, label: "Natural 20 - Rana Portrait" },
        { die: "D4", sides: 4, value: 1, label: "D4 Result 1" },
        { die: "D4", sides: 4, value: 2, label: "D4 Result 2" },
        { die: "D4", sides: 4, value: 3, label: "D4 Result 3" },
        { die: "D4", sides: 4, value: 4, label: "D4 Result 4" }
      ];

      window.LyrianAccurateDiceRoller.preloadFaceArt(setId);
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const validation = window.LyrianAccurateDiceRoller.validateAllFaceSettles({ setId });
      const topology = window.LyrianAccurateDiceRoller.validateNumberingTopology();
      if (validation.failed || topology.failed) {
        document.getElementById("status").textContent =
          `${validation.failed} settle failure(s); ${topology.failed} numbering-topology failure(s).`;
        document.documentElement.dataset.ready = "failed";
        return;
      }

      const grid = document.getElementById("grid");
      checks.forEach((check) => {
        const card = document.createElement("article");
        const image = document.createElement("img");
        const title = document.createElement("h2");
        image.alt = `${check.label}, settled live geometry`;
        image.src = window.LyrianAccurateDiceRoller.buildPreviewDataUrl({
          setId,
          sides: check.sides,
          value: check.value,
          size: 560
        });
        title.textContent = check.label;
        card.append(image, title);
        grid.appendChild(card);
      });
      document.documentElement.dataset.ready = "true";
      window.RanaSpecialResultsValidation = { validation, topology };
    }());
  </script>
</body>
</html>
